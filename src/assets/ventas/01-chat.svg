<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
<rect width="800" height="1000" rx="32" fill="#0b0e13"/>
<rect x="40" y="40" width="720" height="920" rx="24" fill="#11151c" stroke="#232a35" stroke-width="2"/>
<!-- header -->
<rect x="40" y="40" width="720" height="96" rx="24" fill="#161c25"/>
<rect x="40" y="100" width="720" height="36" fill="#161c25"/>
<circle cx="110" cy="88" r="26" fill="#22c55e"/>
