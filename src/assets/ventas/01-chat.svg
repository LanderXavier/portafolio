<rect x="310" y="354" width="390" height="48" rx="16" fill="#1d4ed8"/>
<text x="335" y="384" fill="#fff">A nombre de María Pérez</text>
<rect x="100" y="422" width="460" height="110" rx="16" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
