<text x="125" y="480" fill="#d1fae5">$20.00 · transferencia · María Pérez</text>
<text x="125" y="506" fill="#6ee7b7" font-size="15">Ref: 88213 · Notificado al dueño 🔔</text>
<rect x="100" y="562" width="600" height="110" rx="16" fill="#1f2937"/>
<text x="125" y="592" fill="#fff" font-weight="700">📊 Reporte de hoy (dueño)</text>
<text x="125" y="620" fill="#cbd5e1">3 ventas — Total $86.50</text>
<text x="125" y="646" fill="#cbd5e1" font-size="16">• $20.00 transferencia — María  • $36.50 efectivo…</text>
<rect x="100" y="692" width="600" height="72" rx="16" fill="#451a1a"/>
<text x="125" y="722" fill="#fca5a5">⚠️ Ese comprobante ya estaba registrado.</text>
<text x="125" y="746" fill="#fecaca" font-size="15">Marcado para revisión · sin duplicados</text>
</g>
<!-- input -->
<rect x="100" y="830" width="480" height="60" rx="30" fill="#1f2937"/>
<text x="130" y="866" font-family="sans-serif" font-size="18" fill="#6b7280">Escribe la venta…</text>
<circle cx="630" cy="860" r="30" fill="#22c55e"/>
<text x="630" y="869" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#0b0e13">➤</text>
<text x="400" y="935" text-anchor="middle" font-family="monospace" font-size="13" fill="#4b5563">texto + foto → extracción IA → PostgreSQL</text>
</svg>
