<text x="335" y="222" fill="#fff">transferencia 📸 [comprobante]</text>
<text x="655" y="232" font-size="12" fill="#bfdbfe">10:24</text>
<rect x="100" y="262" width="440" height="72" rx="16" fill="#1f2937"/>
<text x="125" y="290" fill="#fff">¡Anotado! ¿A nombre de quién</text>
