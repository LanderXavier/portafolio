<text x="152" y="82" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">Asistente de Ventas</text>
<text x="152" y="106" font-family="monospace" font-size="14" fill="#22c55e">● en línea · responde en segundos</text>
<!-- bubbles -->
<g font-family="sans-serif" font-size="19">
<rect x="310" y="170" width="390" height="72" rx="16" fill="#1d4ed8"/>
